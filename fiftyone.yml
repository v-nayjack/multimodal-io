name: "@v-nayjack/multimodal-io"
description: Browse cloud storage and import MCAP or LeRobot data as datasets
tags:
  - io
  - multimodal
  - robotics
version: 0.1.0
fiftyone:
  version: ">=2.25.0"
url: https://github.com/v-nayjack/multimodal-io
license: Apache 2.0
operators:
  - import_multimodal
  - upload_multimodal
  - upload_multimodal_dialog
  - get_upload_info
  - start_large_upload
  - resume_large_upload
  - complete_large_upload
  - abort_large_upload
  - finish_upload_batch
panels:
  - MultimodalUploadPanel
secrets:
  - FIFTYONE_MULTIMODAL_IO_ROOT
  - FIFTYONE_MULTIMODAL_IO_PATH_TEMPLATE
